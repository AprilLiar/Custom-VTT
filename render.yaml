services:
  - type: web
    name: custom-vtt
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Commit Homebrew (GM tool): a fine-grained token, Contents read/write on this repo.
      - key: GITHUB_TOKEN
        sync: false
